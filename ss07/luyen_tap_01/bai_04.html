<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
</head>
<body>
<h3>Số Fibonacci đầu tiên chia hết cho 5</h3>

<button onclick="findFibo()">Tìm</button>
<p id="result"></p>

<script>
    function findFibo() {
        let a = 0, b = 1;

        while (true) {
            let next = a + b;
            a = b;
            b = next;

            if (a % 5 === 0) {
                document.getElementById("result").innerText = "Số đầu tiên chia hết cho 5 là: " + a;
                break;
            }
        }
    }
</script>

</body>
</html>
