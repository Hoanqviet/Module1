<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
</head>
<body>
<h3>Đếm từ 1 đến 100</h3>

<button onclick="count()">Bắt đầu</button>
<p id="result"></p>
<script>
    function count() {
        let text ="";

        for (let i = 1 ; i <= 100; i++) {
        text += i +"; ";
        if(i === 99){
            alert("Da hoan thanh")
        }
        }
        text += "."
        document.getElementById("result").innerText = text;
    }


</script>

</body>
</html>
