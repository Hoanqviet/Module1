<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 8</title>
</head>
<body>
<h3>Kiểm tra tuổi hợp lệ</h3>

<input id="age" type="number" placeholder="Nhập tuổi">
<button onclick="check()">Kiểm tra</button>

<p id="result"></p>

<script>
    function check() {
        let age = Number(document.getElementById("age").value);
        let ok = age > 0 && age < 120;
        document.getElementById("result").innerText = ok ? "Tuổi hợp lệ" : "Tuổi không hợp lệ";
    }
</script>

</body>
</html>
