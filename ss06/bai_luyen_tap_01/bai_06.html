<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>

<h2>Bài 6: Tính hoa hồng theo doanh số</h2>

<input id="dt" type="number" placeholder="Doanh thu (triệu)">
<button onclick="calc()">Tính hoa hồng</button>

<p id="result"></p>

<script>
    function calc() {
        let dt = parseFloat(document.getElementById("dt").value);
        let hh = 0;

        if (dt <= 10) hh = 0;
        else if (dt <= 20) hh = dt * 0.10;
        else if (dt <= 50) hh = dt * 0.15;
        else hh = dt * 0.20;

        document.getElementById("result").innerText = "Hoa hồng: " + hh + " triệu";
    }
</script>

</body>
</html>
