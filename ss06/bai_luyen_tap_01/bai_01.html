<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
</head>
<body>

<h2>Bài 1: Kiểm tra a có chia hết cho b</h2>

<input id="a" type="number" placeholder="Nhập a">
<input id="b" type="number" placeholder="Nhập b">
<button onclick="check()">Kiểm tra</button>

<p id="result"></p>

<script>
    function check() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);

        if (b === 0) {
            document.getElementById("result").innerText = "b không được bằng 0!";
            return;
        }

        if (a % b === 0) {
            document.getElementById("result").innerText = "a chia hết cho b";
        } else {
            document.getElementById("result").innerText = "a không chia hết cho b";
        }
    }
</script>

</body>
</html>
