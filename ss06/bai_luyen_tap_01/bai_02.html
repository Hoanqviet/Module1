<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2</title>
</head>
<body>

<h2>Bài 2: Kiểm tra tuổi vào lớp 10</h2>

<input id="age" type="number" placeholder="Nhập tuổi">
<button onclick="check()">Kiểm tra</button>

<p id="result"></p>

<script>
    function check() {
        let age = parseInt(document.getElementById("age").value);

        if (age < 15) {
            document.getElementById("result").innerText = "Không đủ điều kiện vào lớp 10";
        } else {
            document.getElementById("result").innerText = "Đủ điều kiện vào lớp 10";
        }
    }
</script>

</body>
</html>
