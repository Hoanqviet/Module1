<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>

<h2>Bài 3: Kiểm tra số lớn hay nhỏ hơn 0</h2>

<input id="num" type="number" placeholder="Nhập số">
<button onclick="check()">Kiểm tra</button>

<p id="result"></p>

<script>
    function check() {
        let n = parseFloat(document.getElementById("num").value);

        if (n > 0) {
            document.getElementById("result").innerText = "Số lớn hơn 0";
        } else if (n < 0) {
            document.getElementById("result").innerText = "Số nhỏ hơn 0";
        } else {
            document.getElementById("result").innerText = "Số bằng 0";
        }
    }
</script>

</body>
</html>
