<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form 1 và Form 2</title>
    <style>
        body {
            font-family: Arial;
            background-color: cornsilk;
        }

        .form-box {
            width: 420px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }


        .form1 {
            background-color: aqua;
            border: 2px solid lightskyblue;
        }


        .form2 {
            background-color: brown;
            border: 2px solid red;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        .btn-group {
            margin-top: 15px;
        }
    </style>
</head>
<body>


<div class="form-box form1">
    <h2>SỞ THÍCH CỦA BẠN</h2>

    <form>
        <label>Họ và tên:</label><br>
        <input type="text" name="yourName"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Sở thích:</label><br>
        <input type="checkbox" name="hobby" value="thethao"> Thể thao<br>
        <input type="checkbox" name="hobby" value="amnhac"> Âm nhạc<br>
        <input type="checkbox" name="hobby" value="docsach"> Đọc sách<br>
        <input type="checkbox" name="hobby" value="luotweb"> Lướt web<br>
        <input type="checkbox" name="hobby" value="choigame"> Chơi game<br>
        <input type="checkbox" name="hobby" value="dienanh"> Điện ảnh<br>
        <input type="checkbox" name="hobby" value="dulich"> Du lịch<br><br>

        <div class="btn-group">
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </div>
    </form>
</div>


<div class="form-box form2">
    <h2>ĐĂNG KÝ HỌC VIÊN</h2>

    <form>
        <label>Họ và tên:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Ngày sinh:</label><br>
        <input type="date" name="birthday"><br><br>

        <label>Giới tính:</label><br>
        <input type="radio" name="gender" value="Nam"> Nam
        <input type="radio" name="gender" value="Nữ"> Nữ<br><br>

        <label>Địa chỉ:</label><br>
        <input type="text" name="address"><br><br>

        <label>Lớp:</label><br>
        <select name="class">
            <option value="">Chọn lớp</option>
            <option value="lop1">Lớp 1</option>
            <option value="lop2">Lớp 2</option>
            <option value="lop3">Lớp 3</option>
        </select><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Điện thoại:</label><br>
        <input type="tel" name="phone"><br><br>

        <div class="btn-group">
            <input type="submit" value="Đăng ký">
            <input type="reset" value="Nhập lại">
        </div>
    </form>
</div>

</body>
</html>
